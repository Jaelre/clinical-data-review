[package]
name = "clinical-data-review"
version.workspace = true
edition.workspace = true
description = "Local-only desktop application for clinical research data review"
license.workspace = true
authors.workspace = true
keywords = ["healthcare", "clinical", "data", "review", "tauri"]
categories = ["healthcare", "medicine"]

[package.metadata.bundle]
name = "Clinical Data Review"
identifier = "org.arturodebuoi.clinicaldatareview"
category = "Healthcare and Fitness"
short_description = "Local clinical research data review"
long_description = "A local-only desktop application for reviewing research datasets stored in SQLite."

[package.metadata.tauri-winres]
