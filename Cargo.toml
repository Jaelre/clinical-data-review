[workspace]
resolver = "2"
members = [
    "apps/review/src-tauri",
    "crates/platform-db",
    "crates/platform-errors",
    "crates/platform-models",
    "crates/review-core",
    "tests/platform-integration",
    "tools/data-pipeline",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["Arturo de Buoi"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
calamine = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.4", features = ["derive", "env"] }
csv = "1.3"
dirs = "5.0"
dotenvy = "0.15"
encoding_rs = "0.8"
env_logger = "0.11"
futures = "0.3"
indexmap = "2.0"
lazy_static = "1.4"
log = "0.4"
once_cell = "1.19"
polars = { version = "0.49.1", default-features = false, features = ["csv", "lazy"] }
png = "0.17"
quick-xml = "0.31"
rayon = "1.8"
regex = "1.10"
roxmltree = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "macros", "migrate", "runtime-tokio", "sqlite", "uuid"] }
tauri = { version = "2.10.3", features = [] }
tauri-build = { version = "2.0", features = [] }
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
toml = "0.8"
tempfile = "3.8"
uuid = { version = "1.6", features = ["fast-rng", "serde", "v4"] }
walkdir = "2.4"

platform-db = { path = "crates/platform-db" }
platform-errors = { path = "crates/platform-errors" }
platform-models = { path = "crates/platform-models" }
review-core = { path = "crates/review-core" }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
